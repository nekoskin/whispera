name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'LICENSE**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'k8s/**'
      - 'kubernetes/**'
      - 'helm/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '**.py'
      - 'whisp/**'
      - 'panel/**'
      - 'scripts/**'
      - 'monitoring/**'
      - 'deploy/**'
      - 'Makefile'
      - 'docker-compose*.yml'
      - '.claude/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'k8s/**'
      - 'kubernetes/**'
      - 'helm/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '**.py'
      - 'whisp/**'
      - 'panel/**'
      - 'scripts/**'
      - 'monitoring/**'
      - 'deploy/**'
      - 'Makefile'
      - 'docker-compose*.yml'
      - '.claude/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Tidy dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.11.3
        args: --timeout=5m

    - name: Run go vet
      run: go vet ./...

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          exit 1
        fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Download dependencies
      run: go mod download

    - name: Run tests with race detector
      run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

    - name: Check coverage threshold
      if: runner.os == 'Linux'
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < 5" | bc -l) )); then
          echo "::warning::Coverage is below 5%: ${COVERAGE}%"
        fi

    - name: Upload coverage
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        fail_ci_if_error: false

  vuln:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Fuzz protocol parsers
      run: |
        go test ./core/protocol/ -run '^$' -fuzz FuzzFramedRead -fuzztime 60s
        go test ./core/relay/ -run '^$' -fuzz FuzzReadProxyStreamHeader -fuzztime 60s
        go test ./core/socks5/ -run '^$' -fuzz FuzzParseUDPHeader -fuzztime 60s

  scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check shell scripts
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        bash -n install.sh
        bash -n update.sh
        shellcheck -S error install.sh update.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, vuln, fuzz, scripts]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Cross-compile release targets
      run: |
        for target in "windows amd64" "darwin arm64" "linux arm64"; do
          set -- $target
          echo "building $1/$2"
          CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build ./...
        done

    - name: Build
      run: |
        CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o client ./app/goclient
        CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o server ./app/server

    - name: Test build artifacts
      run: |
        ./client --help || true
        ./server --help || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          client
          server
        retention-days: 7
